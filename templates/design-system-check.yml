# Design-system guard (massimo). `npm run ds:check` runs the project's
# scripts/check.mjs: it fails when the component graph is stale, when a change
# adds raw colours or sizes beyond the audit baseline, when generated token
# files or the design-system README are out of date, or when one of the
# project's own checks (guard.extraChecks) fails. A contrast pair below its
# bar shows as a warning under the tokens line and does not fail the job.
# Fix locally with `npm run ds:check`.
name: Design system

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ds-check:
    runs-on: ubuntu-latest
    # A project kept in a package (init.mjs --root <package>) runs in that
    # package, where its package.json has ds:check: uncomment these lines and
    # set the package's path from the repo root.
    # defaults:
    #   run:
    #     working-directory: <package>
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The checks are zero-dependency Node scripts vendored in the project folder,
      # so no install step is needed, unless a guard.extraChecks command needs
      # the repo's packages: then add the repo's install step here.
      # A csf story lane: check.mjs runs stories.mjs --check when stories.lane
      # is "csf", so ds:check covers the check. The lane build and leak check
      # run only in the shadow job's story step; copy that step here to keep
      # them in CI.
      - run: npm run ds:check
